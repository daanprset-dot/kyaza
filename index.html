<!DOCTYPE html>
<html lang="id" class="dark"><head>
<title>Kyaza Inisial - Store</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/logo.jpg"><meta name="theme-color" content="#FF2E4C"><meta name="description" content="Kyaza Inisial - audio sample, vocal inisial, dan style FLM untuk DJ."><meta property="og:image" content="assets/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="store" class="bg-bg text-ink min-h-screen pb-40 antialiased">
<div id="app-header"></div>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">
  <div class="card p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="relative w-full md:w-96">
      <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">search</span>
      <input id="searchInput" oninput="renderStore()" placeholder="Cari FLM / Audio Inisial..." class="inp !pl-11">
    </div>
    <div class="flex items-center gap-3 w-full md:w-auto justify-between"><span id="countLabel" class="text-xs text-muted">Menampilkan 0 Audio</span><select id="sortSel" onchange="renderStore()" class="inp !w-auto"><option value="new">Terbaru</option><option value="sales">Terlaris</option><option value="low">Termurah</option><option value="high">Termahal</option></select></div>
  </div>
  <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  <p id="emptyState" class="hidden text-center text-muted py-16 text-sm">Belum ada produk audio.</p>
</main>
<script src="js/config.js"></script><script src="js/main.js"></script>
</body></html>
